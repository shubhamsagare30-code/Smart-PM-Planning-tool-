services:
  app:
    build: .
    ports:
      - "3001:3001"
    volumes:
      - sqlite-data:/app/backend/data
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DB_PATH=./data/capacity.db
      - CORS_ORIGIN=http://localhost:3001
    restart: unless-stopped

  dev-backend:
    profiles: ["dev"]
    image: node:20-alpine
    working_dir: /app/backend
    ports:
      - "3001:3001"
    volumes:
      - ./backend:/app/backend
      - /app/backend/node_modules
    command: sh -c "npm install && npm run setup && npm run dev"
    environment:
      - PORT=3001
      - CORS_ORIGIN=http://localhost:5173

  dev-frontend:
    profiles: ["dev"]
    image: node:20-alpine
    working_dir: /app/frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - dev-backend

volumes:
  sqlite-data:
